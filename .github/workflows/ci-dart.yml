name: ci-dart

on:
  pull_request:
    paths:
      - "packages/core-dart/**"
      - "spec/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install ajv
      - name: Spec validator
        run: node spec/validate.js
      - name: Spec vectors (edge cases)
        run: node spec/run-vectors.js
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: cd packages/core-dart && dart pub get
      - run: cd packages/core-dart && dart test
      - run: cd packages/core-dart && dart test test/web_compat --platform chrome
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
