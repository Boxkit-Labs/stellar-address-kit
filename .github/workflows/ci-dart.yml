name: ci-dart

on:
  pull_request:
    paths:
      - "packages/core-dart/**"
      - "spec/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install ajv
      - name: Spec validator
        run: node spec/validate.js
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: cd packages/core-dart && dart pub get
      - run: cd packages/core-dart && dart test
      # GitHub's Ubuntu runners disable unprivileged user namespaces, so Chrome
      # aborts with "No usable sandbox!" unless it is started with --no-sandbox.
      - name: Chrome wrapper without sandbox
        run: |
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "${{ steps.setup-chrome.outputs.chrome-path }}" > "$RUNNER_TEMP/chrome-no-sandbox"
          chmod +x "$RUNNER_TEMP/chrome-no-sandbox"
      - run: cd packages/core-dart && dart test test/web_compat --platform chrome
        env:
          CHROME_EXECUTABLE: ${{ runner.temp }}/chrome-no-sandbox
