[package]
name = "rust-address-fuzzer"
version = "0.1.0"
edition = "2021"
description = "Fuzz tester for the prism-core Stellar address parser"
license = "MIT"

[[bin]]
name = "rust-address-fuzzer"
path = "src/main.rs"

[dependencies]
prism-core = { path = "../prism-core" }
arbitrary = { version = "1", features = ["derive"] }
rand = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
